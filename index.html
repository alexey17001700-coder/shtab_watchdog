<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Штаб · Сторож</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#070a12;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.1);
  --gold1:#f7e7a8;--gold2:#d4af37;--gold3:#a67c1a;
  --ice:#7fd8ff;
  --text:#e9eef8;--muted:#8b98b0;
  --ok:#4ade80;--bad:#ff6b6b;--warn:#ffb020;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 600px at 12% -10%,rgba(212,175,55,.15),transparent 60%),
    radial-gradient(800px 600px at 100% 0%,rgba(127,216,255,.12),transparent 55%),
    linear-gradient(180deg,#070a12,#0a0f1d 60%,#070a12);
}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}

/* ---------- вход ---------- */
#gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:22px}
.gate-card{
  width:100%;max-width:400px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  border:1px solid var(--stroke);border-radius:24px;padding:28px 22px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.gate-card h1{margin:0 0 6px;font-size:24px;background:linear-gradient(100deg,var(--gold1),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.gate-card p{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.6}
.gate-card input{
  width:100%;padding:14px;border-radius:14px;border:1px solid var(--stroke);
  background:rgba(0,0,0,.32);color:var(--text);font-family:inherit;font-size:15px;outline:none;margin-bottom:12px;
}
.gate-card input:focus{border-color:rgba(212,175,55,.55)}
.btn{
  width:100%;padding:14px;border:0;border-radius:14px;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:15px;
  background:linear-gradient(135deg,var(--gold1),var(--gold2) 45%,var(--gold3));color:#1a1405;
  box-shadow:0 10px 26px rgba(212,175,55,.26);
}
.btn:active{transform:scale(.975)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--stroke);box-shadow:none}
.btn.sm{padding:11px;font-size:13.5px;border-radius:12px}
.btn.bad{background:linear-gradient(135deg,#ff8a8a,#e03131);color:#fff;box-shadow:none}

/* ---------- шапка ---------- */
#app{display:none;height:100%;flex-direction:column}
.top{
  display:flex;align-items:center;gap:10px;padding:11px 13px;
  padding-top:calc(11px + env(safe-area-inset-top));
  background:rgba(9,13,24,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--stroke);flex-shrink:0;
}
.led{width:11px;height:11px;border-radius:50%;background:#555;flex-shrink:0;transition:.3s}
.led.ok{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.led.bad{background:var(--bad);box-shadow:0 0 12px var(--bad);animation:blink 1s infinite}
.led.wait{background:var(--warn);box-shadow:0 0 12px var(--warn)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.top .tt{flex:1;min-width:0}
.top .t1{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{
  width:40px;height:40px;flex-shrink:0;border-radius:12px;border:1px solid var(--stroke);
  background:var(--panel);color:var(--text);font-size:18px;cursor:pointer;display:grid;place-items:center;
}
.ibtn:active{transform:scale(.92)}
.tabs{display:flex;gap:6px;padding:9px 13px 0;flex-shrink:0}
.tabs button{
  flex:1;padding:11px;border:1px solid var(--stroke);border-radius:13px;background:var(--panel);
  color:var(--muted);font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;transition:.2s;
}
.tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#1a1405;border-color:transparent}

/* ---------- чат ---------- */
#chatView{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#msgs::-webkit-scrollbar{width:5px}
#msgs::-webkit-scrollbar-thumb{background:rgba(212,175,55,.3);border-radius:9px}
.msg{display:flex;gap:9px;max-width:90%;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.wd{align-self:flex-start}
.av{width:34px;height:34px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0a0f1d}
.bub{
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  border:1px solid var(--stroke);border-radius:15px;padding:8px 12px 6px;min-width:0;word-break:break-word;
}
.msg.me .bub{background:linear-gradient(150deg,rgba(212,175,55,.22),rgba(212,175,55,.09));border-color:rgba(212,175,55,.35)}
.msg.wd .bub{background:linear-gradient(150deg,rgba(255,176,32,.16),rgba(255,176,32,.05));border-color:rgba(255,176,32,.4)}
.m-name{font-size:11.5px;font-weight:800;margin-bottom:3px;color:var(--gold1)}
.msg.wd .m-name{color:var(--warn)}
.m-text{font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.m-time{font-size:10.5px;color:var(--muted);margin-top:4px;text-align:right}
.sysmsg{align-self:center;font-size:11.5px;color:var(--muted);background:rgba(0,0,0,.3);padding:5px 12px;border-radius:20px;border:1px solid var(--stroke)}
.empty{margin:auto;text-align:center;color:var(--muted);padding:26px 18px;font-size:13.5px;line-height:1.7}
.empty .e-ic{font-size:46px;margin-bottom:10px}
.composer{flex-shrink:0;padding:9px 11px calc(9px + env(safe-area-inset-bottom));
  background:rgba(9,13,24,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--stroke)}
.crow{display:flex;align-items:flex-end;gap:8px}
.crow textarea{
  flex:1;resize:none;max-height:110px;min-height:46px;padding:13px 14px;border-radius:15px;
  border:1px solid var(--stroke);background:rgba(0,0,0,.34);color:var(--text);
  font-family:inherit;font-size:15px;outline:none;line-height:1.4;
}
.crow textarea:focus{border-color:rgba(212,175,55,.45)}
.cbtn{width:46px;height:46px;flex-shrink:0;border-radius:15px;border:1px solid var(--stroke);
  background:var(--panel);color:var(--text);font-size:19px;cursor:pointer;display:grid;place-items:center}
.cbtn:active{transform:scale(.9)}
.cbtn.send{background:linear-gradient(135deg,var(--gold1),var(--gold2) 50%,var(--gold3));color:#1a1405;border:0}

/* ---------- сторож ---------- */
#watchView{flex:1;overflow-y:auto;padding:14px 13px calc(20px + env(safe-area-inset-bottom));display:none;-webkit-overflow-scrolling:touch}
#watchView.on{display:block}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  border:1px solid var(--stroke);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:800}
.big{display:flex;align-items:center;gap:14px}
.big .bic{font-size:42px;line-height:1}
.big .bt1{font-size:19px;font-weight:800}
.big .bt2{font-size:12.5px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(0,0,0,.28);border:1px solid var(--stroke);border-radius:13px;padding:10px 8px;text-align:center}
.stat .sv{font-size:17px;font-weight:800;color:var(--gold1)}
.stat .sl{font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.4px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{flex:1;font-size:13.5px;color:var(--text)}
.row input[type=text],.row select{
  flex:1.3;padding:11px;border-radius:12px;border:1px solid var(--stroke);
  background:rgba(0,0,0,.32);color:var(--text);font-family:inherit;font-size:13.5px;outline:none;
}
.sw{position:relative;width:50px;height:28px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.14);transition:.25s;cursor:pointer}
.sw span::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked + span{background:linear-gradient(135deg,var(--gold2),var(--gold3))}
.sw input:checked + span::after{transform:translateX(22px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#log{max-height:44vh;overflow-y:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.7}
#log::-webkit-scrollbar{width:4px}
#log::-webkit-scrollbar-thumb{background:rgba(212,175,55,.3);border-radius:9px}
.le{padding:5px 8px;border-radius:9px;margin-bottom:4px;border-left:3px solid transparent;background:rgba(0,0,0,.22)}
.le.ok{border-left-color:var(--ok)}
.le.bad{border-left-color:var(--bad);background:rgba(255,107,107,.09)}
.le.info{border-left-color:var(--ice)}
.le .lt{color:var(--muted);margin-right:6px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:rgba(20,26,42,.97);border:1px solid rgba(212,175,55,.4);color:var(--text);
  padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:99;
  opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- ================= ВХОД ================= -->
<div id="gate">
  <div class="gate-card">
    <h1>🛡 Штаб · Сторож</h1>
    <p>Чат со Штабом + слежение за сервером.<br>Работает с GitHub — открывается, даже если сервер лёг.</p>
    <input id="inNick" maxlength="18" placeholder="Твой ник (как в чате)">
    <button class="btn" onclick="enterApp()">Войти</button>
  </div>
</div>

<!-- ================= ПРИЛОЖЕНИЕ ================= -->
<div id="app" class="wrap">
  <div class="top">
    <span class="led" id="led"></span>
    <div class="tt">
      <div class="t1" id="topName">Штаб · Сторож</div>
      <div class="t2" id="topSub">проверка связи…</div>
    </div>
    <button class="ibtn" onclick="pingNow()" title="Проверить сейчас">🧪</button>
    <button class="ibtn" onclick="openSettings()" title="Настройки">⚙️</button>
  </div>

  <div class="tabs">
    <button id="tabChat" class="on" onclick="showTab('chat')">💬 Чат</button>
    <button id="tabWatch" onclick="showTab('watch')">🛡 Сторож</button>
  </div>

  <!-- ЧАТ -->
  <div id="chatView">
    <div id="msgs"></div>
    <div class="composer">
      <div class="crow">
        <textarea id="inMsg" rows="1" placeholder="Сообщение…" oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
        <button class="cbtn send" onclick="sendText()">➤</button>
      </div>
    </div>
  </div>

  <!-- СТОРОЖ -->
  <div id="watchView">
    <div class="card">
      <div class="big">
        <div class="bic" id="wdIc">⏳</div>
        <div style="flex:1;min-width:0">
          <div class="bt1" id="wdTitle">Проверка…</div>
          <div class="bt2" id="wdSub">—</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="sv" id="stUptime">—</div><div class="sl">РАБОТАЕТ</div></div>
        <div class="stat"><div class="sv" id="stDown">—</div><div class="sl">ПРОСТОЙ</div></div>
        <div class="stat"><div class="sv" id="stFails">0</div><div class="sl">ПАДЕНИЙ</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Управление</h3>
      <div class="grid2" style="margin-bottom:8px">
        <button class="btn sm" id="wdToggle" onclick="toggleWatch()">▶ СТАРТ</button>
        <button class="btn sm ghost" onclick="pingNow()">🧪 Проверить</button>
      </div>
      <div class="grid2">
        <button class="btn sm ghost" onclick="sendReport()">📤 Отчёт в чат</button>
        <button class="btn sm ghost" onclick="clearLog()">🗑 Очистить</button>
      </div>
    </div>

    <div class="card">
      <h3>Настройки слежения</h3>
      <div class="row">
        <label>Адрес сервера</label>
        <input type="text" id="wdUrl" onchange="saveCfg()">
      </div>
      <div class="row">
        <label>Проверять каждые</label>
        <select id="wdMs" onchange="saveCfg()">
          <option value="10000">10 сек</option>
          <option value="15000">15 сек</option>
          <option value="30000">30 сек</option>
          <option value="60000">1 мин</option>
          <option value="300000">5 мин</option>
        </select>
      </div>
      <div class="row">
        <label>🔊 Звук при падении</label>
        <div class="sw"><input type="checkbox" id="wdSound" onchange="saveCfg()"><span></span></div>
      </div>
      <div class="row">
        <label>🔔 Уведомление</label>
        <div class="sw"><input type="checkbox" id="wdNotify" onchange="saveCfg()"><span></span></div>
      </div>
      <div class="row" style="margin-bottom:0">
        <label>🤖 Отчёт в чат</label>
        <div class="sw"><input type="checkbox" id="wdReport" onchange="saveCfg()"><span></span></div>
      </div>
    </div>

    <div class="card">
      <h3>Журнал</h3>
      <div id="log"><div class="le info"><span class="lt">—</span>Журнал пуст</div></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================== НАСТРОЙКИ ================== */
const VIVO = 'wss://shtab-boss.duckdns.org:8443/ws';
const HTTP = 'https://shtab-boss.duckdns.org:8443/';
const WATCH_NICK = '🤖 СТОРОЖ';
const WATCH_ID = 'watchdog';
const LS = 'wd_v1_';

let me = null;
let channels = [], cur = null, store = {}, seen = {};
let socks = {}, retry = {}, outbox = {};
let reports = [];                       // отчёты сторожа, ждущие отправки
let wd = { url: HTTP, ms: 15000, sound: true, notify: true, report: true };
let st = { alive: null, okSince: 0, downAt: 0, fails: 0, checks: 0, log: [] };
let timer = null;

/* ================== УТИЛИТЫ ================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtTime = t => new Date(t).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
function hueOf(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }
function colorOf(s){ return 'hsl(' + hueOf(s) + ',72%,62%)'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
function dur(ms){
  if (ms < 1000) return '0 сек';
  const s = Math.floor(ms/1000);
  if (s < 60) return s + ' сек';
  const m = Math.floor(s/60);
  if (m < 60) return m + ' мин ' + (s%60) + ' сек';
  const h = Math.floor(m/60);
  if (h < 24) return h + ' ч ' + (m%60) + ' мин';
  return Math.floor(h/24) + ' дн ' + (h%24) + ' ч';
}

/* ================== ШИФРОВАНИЕ (как в Nexus Chat) ================== */
const E2E = !!(window.crypto && window.crypto.subtle);
const keyCache = new Map();
function b64(u8){ let s=''; const CH=0x8000; for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return btoa(s); }
function unb64(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }
function secretOf(chId){ const c = channels.find(x => x.id === chId); return (c && c.sec) ? c.sec : ('nx-default-' + chId); }
async function getKey(secret){
  if (keyCache.has(secret)) return keyCache.get(secret);
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: enc.encode('nexus-e2e-salt-v1'), iterations:120000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  keyCache.set(secret, key);
  return key;
}
async function encryptObj(secret, obj){
  const key = await getKey(secret);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64(iv), d: b64(new Uint8Array(ct)) };
}
async function decryptObj(secret, p){
  const key = await getKey(secret);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(p.iv) }, key, unb64(p.d));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function packMsg(chId, m){
  if (!E2E) return m;
  const { id, time, ...rest } = m;
  const enc = await encryptObj(secretOf(chId), rest);
  return { id, time, e:1, iv: enc.iv, d: enc.d };
}
async function unpackMsg(chId, p){
  if (!p || p.e !== 1) return p;
  try {
    const sec = await decryptObj(secretOf(chId), p);
    return Object.assign({ id: p.id, time: p.time }, sec);
  } catch(e){
    return { id: p.id || uid(), time: p.time || Date.now(), type:'sys', text:'🔒 Сообщение зашифровано другим ключом' };
  }
}

/* ================== ВХОД ================== */
function enterApp(){
  const nick = ($('inNick').value || '').trim();
  if (nick.length < 2){ toast('Ник — минимум 2 символа'); return; }
  me = { nick, id: 'wd_' + nick.toLowerCase(), color: colorOf(nick) };
  localStorage.setItem(LS + 'me', JSON.stringify(me));
  $('gate').style.display = 'none';
  $('app').style.display = 'flex';
  loadCfg();
  loadLog();
  renderLog();
  wsConnect('__dir__');
  addLog('info', 'Сторож запущен · ' + wd.url);
  if (wd.report) startWatch();
  else renderWatch();
}

/* ================== WEBSOCKET ================== */
function wsConnect(room){
  if (!room) return;
  const ex = socks[room];
  if (ex && (ex.readyState === 0 || ex.readyState === 1)) return;
  let s;
  try { s = new WebSocket(VIVO); } catch(e){ return; }
  socks[room] = s;
  s.onopen = () => {
    setNet(true);
    try { s.send(JSON.stringify({ t:'join', room, id: me.id, nick: me.nick })); } catch(e){}
    const q = outbox[room];
    if (q && q.length){ outbox[room] = []; q.forEach(o => { try { s.send(JSON.stringify(o)); } catch(e){} }); }
    if (room === cur) flushReports();
  };
  s.onmessage = e => { try { onWs(room, JSON.parse(e.data)); } catch(err){} };
  s.onclose = () => {
    if (socks[room] === s) delete socks[room];
    setNet(false);
    clearTimeout(retry[room]);
    retry[room] = setTimeout(() => wsConnect(room), 4000);
  };
  s.onerror = () => { try { s.close(); } catch(e){} };
}
function wsPub(room, obj){
  if (!room) return false;
  const s = socks[room];
  if (s && s.readyState === 1){ try { s.send(JSON.stringify(obj)); return true; } catch(e){} }
  (outbox[room] = outbox[room] || []).push(obj);
  if (outbox[room].length > 40) outbox[room].shift();
  wsConnect(room);
  return false;
}
function setNet(on){
  $('topSub').textContent = on ? 'связь с сервером есть' : 'нет связи — переподключение…';
}
async function onWs(room, d){
  if (!d || !d.t) return;
  if (d.t === 'dir'){ mergeDir(d.d); return; }
  if (d.t === 'history'){
    const r = d.room || room;
    for (const it of (d.items || [])){
      let x; try { x = (typeof it === 'string') ? JSON.parse(it) : it; } catch(e){ continue; }
      if (x) await dispatch(r, x);
    }
    if (r === cur) renderMsgs();
    return;
  }
  if (d.t === 'hello' || d.t === 'pong' || d.t === 'welcome' || d.t === 'presence') return;
  if (d.t === 'ping'){ wsPub(room, { t:'pong' }); return; }
  await dispatch(d.room || room, d);
}
async function dispatch(room, d){
  if (!d || !d.t) return;
  if (d.t === 'msg'){
    if (d.d && d.d.kind === 'typing') return;
    const m = await unpackMsg(room, d.d);
    if (m) addMsg(room, m, true);
    return;
  }
}
function mergeDir(list){
  if (!Array.isArray(list) || !list.length) return;
  const map = new Map(channels.map(c => [c.id, c]));
  list.forEach(c => { if (c && c.id && !c.del) map.set(c.id, Object.assign({}, map.get(c.id) || {}, c)); });
  channels = Array.from(map.values());
  if (!cur && channels.length) joinChannel(channels[0].id);
  else if (cur) renderMsgs();
}
function joinChannel(id){
  cur = id;
  if (!store[id]){ store[id] = []; seen[id] = new Set(); }
  const c = channels.find(x => x.id === id);
  $('topName').textContent = c ? ((c.ic || '💬') + ' ' + c.name) : 'Чат';
  wsConnect(id);
  renderMsgs();
}

/* ================== СООБЩЕНИЯ ================== */
function addMsg(chId, m, live){
  if (!m) return;
  if (!store[chId]){ store[chId] = []; seen[chId] = new Set(); }
  if (seen[chId].has(m.id)) return;
  seen[chId].add(m.id);
  store[chId].push(m);
  if (store[chId].length > 150) store[chId] = store[chId].slice(-150);
  if (live && chId === cur) renderMsgs();
}
function renderMsgs(){
  const box = $('msgs');
  if (!cur){ box.innerHTML = '<div class="empty"><div class="e-ic">💬</div>Ждём каналы от сервера…</div>'; return; }
  const list = store[cur] || [];
  if (!list.length){ box.innerHTML = '<div class="empty"><div class="e-ic">💬</div>Пока пусто.<br>Напиши первое сообщение.</div>'; return; }
  box.innerHTML = list.map(renderMsg).join('');
  box.scrollTop = box.scrollHeight;
}
function renderMsg(m){
  if (m.type === 'sys') return '<div class="sysmsg">' + esc(m.text) + '</div>';
  const mine = !!(me && m.id_user === me.id);
  const isWd = (m.id_user === WATCH_ID) || (m.nick === WATCH_NICK);
  const av = '<div class="av" style="background:' + (m.color || colorOf(m.nick || '?')) + '">' + esc((m.nick || '?')[0]) + '</div>';
  return '<div class="msg ' + (mine ? 'me' : '') + (isWd ? ' wd' : '') + '">' + av +
    '<div class="bub">' + (mine ? '' : '<div class="m-name">' + esc(m.nick) + '</div>') +
    '<div class="m-text">' + esc(m.text) + '</div>' +
    '<div class="m-time">' + fmtTime(m.time) + '</div></div></div>';
}
function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 110) + 'px'; }
function onKey(e){ if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); } }
async function sendText(){
  const el = $('inMsg');
  const txt = el.value.trim();
  if (!txt) return;
  if (!cur){ toast('Канал ещё не загрузился'); return; }
  el.value = ''; autoGrow(el);
  await pushMsg(txt, false);
}
async function pushMsg(text, asWatch){
  const ch = cur;
  if (!ch) return false;
  const m = {
    id: uid(),
    id_user: asWatch ? WATCH_ID : me.id,
    nick: asWatch ? WATCH_NICK : me.nick,
    color: asWatch ? '#ffb020' : me.color,
    time: Date.now(), type:'text', text
  };
  addMsg(ch, m, true);
  try {
    const env = await packMsg(ch, m);
    return wsPub(ch, { t:'msg', room: ch, d: env });
  } catch(e){ return false; }
}

/* ================== СТОРОЖ ================== */
function loadCfg(){
  try {
    const s = JSON.parse(localStorage.getItem(LS + 'cfg') || 'null');
    if (s) wd = Object.assign(wd, s);
  } catch(e){}
  $('wdUrl').value = wd.url;
  $('wdMs').value = String(wd.ms);
  $('wdSound').checked = !!wd.sound;
  $('wdNotify').checked = !!wd.notify;
  $('wdReport').checked = !!wd.report;
}
function saveCfg(){
  wd.url = ($('wdUrl').value || HTTP).trim();
  wd.ms = parseInt($('wdMs').value, 10) || 15000;
  wd.sound = $('wdSound').checked;
  wd.notify = $('wdNotify').checked;
  wd.report = $('wdReport').checked;
  localStorage.setItem(LS + 'cfg', JSON.stringify(wd));
  if (timer){ clearInterval(timer); timer = setInterval(pingTick, wd.ms); }
  toast('Настройки сохранены');
}
function startWatch(){
  if (timer) clearInterval(timer);
  timer = setInterval(pingTick, wd.ms);
  $('wdToggle').textContent = '⏸ СТОП';
  $('wdToggle').classList.remove('ghost');
  pingTick();
}
function stopWatch(){
  if (timer) clearInterval(timer);
  timer = null;
  $('wdToggle').textContent = '▶ СТАРТ';
  $('wdToggle').classList.add('ghost');
}
function toggleWatch(){ timer ? stopWatch() : startWatch(); }

async function pingTick(){
  const alive = await pingOnce();
  st.checks++;
  const was = st.alive;
  st.alive = alive;

  if (alive){
    st.okSince = st.okSince || Date.now();
    if (was === false){
      const down = st.downAt ? (Date.now() - st.downAt) : 0;
      st.downAt = 0;
      addLog('ok', '🟢 Сервер ПОДНЯЛСЯ · простой ' + dur(down));
      if (wd.report) queueReport('🟢 СТОРОЖ | ' + fmtTime(Date.now()) + ' | Сервер ПОДНЯЛСЯ | простой ' + dur(down));
      if (wd.sound) beep(true);
      if (wd.notify) notify('🟢 Сервер поднялся', 'Простой: ' + dur(down));
    }
  } else {
    if (was !== false){
      st.downAt = Date.now();
      st.fails++;
      addLog('bad', '🔴 Сервер НЕ ОТВЕЧАЕТ · ' + wd.url);
      if (wd.report) queueReport('🔴 СТОРОЖ | ' + fmtTime(Date.now()) + ' | Сервер НЕ ОТВЕЧАЕТ | ' + wd.url);
      if (wd.sound) beep(false);
      if (wd.notify) notify('🔴 Сервер не отвечает', 'Проверь телефон Б');
    }
  }
  renderWatch();
  renderLog();
}
function pingNow(){ toast('Проверяю…'); pingTick(); }

/* проверка: сначала обычный HTTP-запрос, если не прошёл — пробуем WebSocket */
async function pingOnce(){
  const httpOk = await pingHttp();
  if (httpOk) return true;
  return await pingWs();
}
function pingHttp(){
  return new Promise(res => {
    const ctrl = new AbortController();
    const to = setTimeout(() => { try { ctrl.abort(); } catch(e){} res(false); }, 8000);
    fetch(wd.url + '?_=' + Date.now(), { mode:'no-cors', cache:'no-store', signal: ctrl.signal })
      .then(() => { clearTimeout(to); res(true); })
      .catch(() => { clearTimeout(to); res(false); });
  });
}
function pingWs(){
  return new Promise(res => {
    let done = false;
    let s;
    const fin = v => { if (!done){ done = true; clearTimeout(to); try { s && s.close(); } catch(e){} res(v); } };
    const to = setTimeout(() => fin(false), 8000);
    try { s = new WebSocket(VIVO); } catch(e){ fin(false); return; }
    s.onopen = () => fin(true);
    s.onerror = () => fin(false);
    s.onclose = () => fin(false);
  });
}

function renderWatch(){
  const ic = $('wdIc'), t1 = $('wdTitle'), t2 = $('wdSub'), led = $('led');
  if (st.alive === null){
    ic.textContent = '⏳'; t1.textContent = 'Проверка…'; t2.textContent = wd.url;
    led.className = 'led wait';
  } else if (st.alive){
    ic.textContent = '🟢'; t1.textContent = 'Сервер работает';
    t2.textContent = 'без сбоев ' + dur(Date.now() - (st.okSince || Date.now()));
    led.className = 'led ok';
  } else {
    ic.textContent = '🔴'; t1.textContent = 'Сервер НЕ ОТВЕЧАЕТ';
    t2.textContent = 'простой ' + dur(Date.now() - (st.downAt || Date.now()));
    led.className = 'led bad';
  }
  $('stUptime').textContent = st.okSince ? dur(Date.now() - st.okSince) : '—';
  $('stDown').textContent = st.downAt ? dur(Date.now() - st.downAt) : '—';
  $('stFails').textContent = String(st.fails);
}

/* ================== ЖУРНАЛ ================== */
function addLog(kind, text){
  st.log.push({ t: Date.now(), k: kind, s: text });
  if (st.log.length > 300) st.log = st.log.slice(-300);
  try { localStorage.setItem(LS + 'log', JSON.stringify(st.log.slice(-120))); } catch(e){}
}
function loadLog(){
  try { st.log = JSON.parse(localStorage.getItem(LS + 'log') || '[]'); } catch(e){ st.log = []; }
}
function renderLog(){
  const box = $('log');
  if (!st.log.length){ box.innerHTML = '<div class="le info"><span class="lt">—</span>Журнал пуст</div>'; return; }
  box.innerHTML = st.log.slice().reverse().map(e =>
    '<div class="le ' + e.k + '"><span class="lt">' + fmtTime(e.t) + '</span>' + esc(e.s) + '</div>').join('');
}
function clearLog(){
  st.log = [];
  try { localStorage.removeItem(LS + 'log'); } catch(e){}
  renderLog();
  toast('Журнал очищен');
}

/* ================== ОТЧЁТЫ В ЧАТ ================== */
function queueReport(text){
  reports.push(text);
  if (reports.length > 60) reports.shift();
  flushReports();
}
async function flushReports(){
  if (!cur || !reports.length) return;
  const s = socks[cur];
  if (!s || s.readyState !== 1) return;
  const q = reports; reports = [];
  for (const r of q) await pushMsg(r, true);
}
async function sendReport(){
  const ok = st.checks - st.fails;
  const lines = [
    '📊 СТОРОЖ | отчёт ' + fmtTime(Date.now()),
    'Сервер: ' + (st.alive === null ? 'неизвестно' : (st.alive ? '🟢 работает' : '🔴 не отвечает')),
    'Проверок: ' + st.checks + ' · падений: ' + st.fails,
    'Без сбоев: ' + (st.okSince ? dur(Date.now() - st.okSince) : '—'),
    'Адрес: ' + wd.url
  ];
  const tail = st.log.slice(-8).map(e => fmtTime(e.t) + ' ' + e.s);
  const text = lines.concat(['— последние события —'], tail).join('\n');
  if (!cur){ toast('Канал ещё не загрузился'); return; }
  await pushMsg(text, true);
  toast('Отчёт отправлен в чат 🤖');
}

/* ================== ЗВУК И УВЕДОМЛЕНИЯ ================== */
let actx = null;
function beep(good){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const seq = good ? [660, 880] : [880, 440, 880];
    seq.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.start(t0); o.stop(t0 + 0.18);
    });
  } catch(e){}
}
async function notify(title, body){
  try {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') await Notification.requestPermission();
    if (Notification.permission !== 'granted') return;
    if ('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, { body, tag:'wd', icon:'icon.svg', badge:'icon.svg', vibrate:[200,100,200] });
    } else {
      new Notification(title, { body });
    }
  } catch(e){}
}

/* ================== ИНТЕРФЕЙС ================== */
function showTab(t){
  const chat = t === 'chat';
  $('tabChat').classList.toggle('on', chat);
  $('tabWatch').classList.toggle('on', !chat);
  $('chatView').style.display = chat ? 'flex' : 'none';
  $('watchView').classList.toggle('on', !chat);
  if (!chat){ renderWatch(); renderLog(); }
}
function openSettings(){
  showTab('watch');
  $('watchView').scrollTo({ top: 9999, behavior:'smooth' });
}

/* ================== СТАРТ ================== */
(function boot(){
  try {
    const saved = JSON.parse(localStorage.getItem(LS + 'me') || 'null');
    if (saved && saved.nick){
      me = saved;
      $('gate').style.display = 'none';
      $('app').style.display = 'flex';
      loadCfg(); loadLog(); renderLog();
      wsConnect('__dir__');
      addLog('info', 'Сторож запущен · ' + wd.url);
      if (wd.report) startWatch(); else renderWatch();
    }
  } catch(e){}
})();

/* держим экран активным, пока открыт сторож */
if ('wakeLock' in navigator){
  const lock = () => navigator.wakeLock.request('screen').catch(()=>{});
  document.addEventListener('visibilitychange', () => { if (!document.hidden) lock(); });
  lock();
}

/* service worker — нужен для уведомлений */
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(()=>{});
}

/* вернулись в приложение — сразу проверяем сервер */
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !me) return;
  if (timer) pingTick();
  flushReports();
});

/* обновляем счётчики времени каждую секунду */
setInterval(() => { if (st.alive !== null) renderWatch(); }, 1000);
</script>
